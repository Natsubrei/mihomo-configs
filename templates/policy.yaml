# 三个客户端入口共用的策略源；不是独立运行配置。
# 修改此文件后运行：python -m tools.render build
# 构建 mihomo-party 覆写、Linux 原生配置和 FlClash 脚本，不包含节点或私人订阅。
# 要求内核支持 include-all、exclude-filter、empty-fallback；已测版本见 README。

profile:
  store-selected: true

proxy-groups:
  - name: 节点选择
    type: select
    include-all: true
    # 保守排除信息条目，不按 GB、倍率、Music 等宽泛词过滤真实节点。
    # 命名只是启发式：信息条目可能是实际节点的别名，并非一定无效。
    exclude-filter: &info-filter '(?i)剩余流量|剩餘流量|套餐到期|到期时间|到期時間|距离.*重置|距離.*重置|流量重置|重置时间|重置時間|订阅地址|訂閱地址|官网地址|官網地址|不再支持|更换客户端|使用文档|(^|[^A-Za-z])(traffic[ _-]*(left|remaining)|expire[sd]?|expiry)([^A-Za-z]|$)'
    empty-fallback: REJECT
    proxies:
      - 自动选择
      - 故障转移
      - 香港节点
      - 台湾节点
      - 日本节点
      - 狮城节点
      - 美国节点
      - 韩国节点
      - 德国节点

  - name: 故障转移
    type: fallback
    include-all: true
    exclude-filter: *info-filter
    empty-fallback: REJECT
    # include-all 按名称排序；选择第一个健康节点，不保证最快。
    url: &test-url https://www.gstatic.com/generate_204
    interval: 60
    timeout: 3000
    expected-status: 204
    lazy: false
    max-failed-times: 1

  - name: 自动选择
    type: url-test
    include-all: true
    exclude-filter: *info-filter
    empty-fallback: REJECT
    url: *test-url
    interval: 300
    timeout: 3000
    expected-status: 204
    # 当前仍可用时不追更快的；延迟差超过 200ms 或探测失败再换。
    tolerance: 200
    lazy: false
    max-failed-times: 1

  # 业务组可直接选择任意真实节点。AI/登录服务建议手动固定节点，减少出口变更。
  - name: OpenAI
    type: select
    include-all: true
    exclude-filter: *info-filter
    empty-fallback: REJECT
    proxies: [节点选择]

  - name: 电报消息
    type: select
    include-all: true
    exclude-filter: *info-filter
    empty-fallback: REJECT
    proxies: [节点选择]

  - name: 油管视频
    type: select
    include-all: true
    exclude-filter: *info-filter
    empty-fallback: REJECT
    proxies: [节点选择]

  - name: 奈飞视频
    type: select
    include-all: true
    exclude-filter: *info-filter
    empty-fallback: REJECT
    proxies: [节点选择]

  - name: 巴哈姆特
    type: select
    include-all: true
    exclude-filter: *info-filter
    empty-fallback: REJECT
    # 是否能访问地区限定内容取决于实际出口及服务政策，分组不能保证解锁。
    proxies: [节点选择, 台湾节点]

  - name: 哔哩哔哩
    type: select
    proxies: [DIRECT, 台湾节点, 香港节点, 节点选择]

  - name: 国外媒体
    type: select
    proxies: [节点选择, 自动选择]

  - name: 国内媒体
    type: select
    proxies: [DIRECT, 节点选择]

  - name: 谷歌FCM
    type: select
    proxies: [节点选择, DIRECT]

  - name: 微软Bing
    type: select
    proxies: [节点选择, DIRECT]

  - name: 微软云盘
    type: select
    proxies: [DIRECT, 节点选择]

  - name: 微软服务
    type: select
    proxies: [DIRECT, 节点选择]

  - name: 苹果服务
    type: select
    proxies: [DIRECT, 节点选择]

  - name: 游戏平台
    type: select
    proxies: [DIRECT, 节点选择]

  - name: 网易音乐
    type: select
    proxies: [DIRECT, 节点选择]

  - name: 全球直连
    type: select
    proxies: [DIRECT, 节点选择]

  - name: 广告拦截
    type: select
    proxies: [REJECT, DIRECT]

  - name: 应用净化
    type: select
    proxies: [REJECT, DIRECT]

  - name: 漏网之鱼
    type: select
    proxies: [节点选择, DIRECT]

  - name: 规则更新
    type: select
    # 通过已加载节点下载 GitHub 规则，不依赖第三方 GitHub 镜像。
    # 若你的网络能直接访问 GitHub，可手动选择 DIRECT。
    proxies: [节点选择, DIRECT]

  # 地区匹配支持常见中英文名称、国家代码、旗帜。
  # 两/三字母代码限制字母边界：US01 可匹配，Australia 不会被 US 误匹配。
  # 没有对应节点时明确 REJECT，不回退到 COMPATIBLE（直连）。
  - name: 香港节点
    type: url-test
    include-all: true
    filter: '(?i)🇭🇰|香港|Hong[ _-]?Kong|(^|[^A-Za-z])HK([^A-Za-z]|$)'
    exclude-filter: *info-filter
    empty-fallback: REJECT
    url: *test-url
    interval: 300
    timeout: 5000
    expected-status: 204
    tolerance: 100
    lazy: true

  - name: 台湾节点
    type: url-test
    include-all: true
    filter: '(?i)🇹🇼|台湾|台灣|台北|臺北|Taiwan|Taipei|Taichung|(^|[^A-Za-z])TW([^A-Za-z]|$)'
    exclude-filter: *info-filter
    empty-fallback: REJECT
    url: *test-url
    interval: 300
    timeout: 5000
    expected-status: 204
    tolerance: 100
    lazy: true

  - name: 日本节点
    type: url-test
    include-all: true
    filter: '(?i)🇯🇵|日本|东京|東京|大阪|Japan|Tokyo|Osaka|(^|[^A-Za-z])JP([^A-Za-z]|$)'
    exclude-filter: *info-filter
    empty-fallback: REJECT
    url: *test-url
    interval: 300
    timeout: 5000
    expected-status: 204
    tolerance: 100
    lazy: true

  - name: 狮城节点
    type: url-test
    include-all: true
    filter: '(?i)🇸🇬|新加坡|狮城|獅城|Singapore|(^|[^A-Za-z])SG([^A-Za-z]|$)'
    exclude-filter: *info-filter
    empty-fallback: REJECT
    url: *test-url
    interval: 300
    timeout: 5000
    expected-status: 204
    tolerance: 100
    lazy: true

  - name: 美国节点
    type: url-test
    include-all: true
    filter: '(?i)🇺🇸|美国|美國|洛杉矶|洛杉磯|硅谷|矽谷|西雅图|西雅圖|圣何塞|聖何塞|United[ _-]?States|California|Los[ _-]?Angeles|San[ _-]?Jose|Seattle|New[ _-]?York|(^|[^A-Za-z])(US|USA)([^A-Za-z]|$)'
    exclude-filter: *info-filter
    empty-fallback: REJECT
    url: *test-url
    interval: 300
    timeout: 5000
    expected-status: 204
    tolerance: 100
    lazy: true

  - name: 韩国节点
    type: url-test
    include-all: true
    filter: '(?i)🇰🇷|韩国|韓國|首尔|首爾|仁川|Korea|Seoul|Incheon|(^|[^A-Za-z])(KR|KOR)([^A-Za-z]|$)'
    exclude-filter: *info-filter
    empty-fallback: REJECT
    url: *test-url
    interval: 300
    timeout: 5000
    expected-status: 204
    tolerance: 100
    lazy: true

  - name: 德国节点
    type: url-test
    include-all: true
    filter: '(?i)🇩🇪|德国|德國|法兰克福|法蘭克福|Germany|Frankfurt|Berlin|(^|[^A-Za-z])(DE|GER)([^A-Za-z]|$)'
    exclude-filter: *info-filter
    empty-fallback: REJECT
    url: *test-url
    interval: 300
    timeout: 5000
    expected-status: 204
    tolerance: 100
    lazy: true

# 这里使用原生 rule-providers；仅 Party 构建产物会转换为 rule-providers!。
# ACL4SSR .list 含 DOMAIN-SUFFIX/IP-CIDR 等前缀，必须用 classical + text。
rule-providers:
  LocalAreaNetwork: &ruleset
    type: http
    behavior: classical
    format: text
    interval: 86400
    proxy: 规则更新
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
    path: ./ruleset/generic/LocalAreaNetwork.list
  UnBan:
    <<: *ruleset
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
